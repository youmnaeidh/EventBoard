name: CI
on:
  push: { branches: [main, master] }
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: eventboard_test }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventboard_test
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      PUBLIC_WEB_ORIGIN: https://youmnaeidh.github.io
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck -w apps/api
      - run: npm test -w apps/api
      - run: npm run build -w apps/web
      - run: npm test -w apps/web

  ai:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: services/ai } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: "services/ai/requirements*.txt" }
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  e2e:
    runs-on: ubuntu-latest
    needs: [node, ai]
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: eventboard }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
      - run: npm run build
      - run: pip install -r services/ai/requirements.txt
      - name: Start AI service
        working-directory: services/ai
        env: { AI_SERVICE_TOKEN: ci-token }
        run: nohup python -m uvicorn app.main:app --port 8001 > ai.log 2>&1 &
      - name: Start API (serves the built web app)
        env:
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/eventboard
          JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
          AI_SERVICE_URL: http://localhost:8001
          AI_SERVICE_TOKEN: ci-token
          AUTH_RATE_LIMIT: "1000"
          WEB_DIST: ${{ github.workspace }}/apps/web/dist
        run: nohup node apps/api/dist/server.js > api.log 2>&1 &
      - run: npx wait-on http://localhost:4000/api/health http://localhost:8001/health --timeout 90000
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with: { name: e2e-debug, path: "test-results\napi.log\nservices/ai/ai.log" }
