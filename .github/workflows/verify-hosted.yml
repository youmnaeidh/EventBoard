name: Verify hosted v2 before cutover
on:
  workflow_dispatch:
  push:
    branches: [release/eventboard-v2-pages]
    paths:
      - .github/workflows/verify-hosted.yml
      - e2e/pages.spec.ts
      - playwright.pages.config.ts
      - apps/web/**
      - package-lock.json

permissions:
  contents: write

concurrency:
  group: eventboard-hosted-verification
  cancel-in-progress: false

jobs:
  hosted:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_API_BASE_URL: https://eventboard-api-orv8.onrender.com
      E2E_API_URL: https://eventboard-api-orv8.onrender.com
      E2E_PAGES_URL: https://youmnaeidh.github.io/EventBoard/
      E2E_PAGES_ARTIFACT: apps/web/dist
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:pages -w apps/web
      - run: npx playwright install --with-deps chromium
      - name: Wake free services and verify database health
        run: |
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 https://eventboard-ai.onrender.com/health
          curl --fail --silent --show-error --retry 5 --retry-all-errors --retry-delay 5 --max-time 120 "$E2E_API_URL/api/health"
      - name: Test real Render API and Neon from the Pages browser origin
        run: npx playwright test --config playwright.pages.config.ts
      - name: Save verified screenshots to the release branch
        if: success() && github.ref == 'refs/heads/release/eventboard-v2-pages'
        run: |
          mkdir -p docs/screenshots
          for name in home-desktop home-mobile organizer-desktop; do
            source=$(find test-results -type f -name "$name.png" -print -quit)
            test -n "$source"
            cp "$source" "docs/screenshots/$name.png"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/home-desktop.png docs/screenshots/home-mobile.png docs/screenshots/organizer-desktop.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture verified hosted demo screenshots [skip ci]"
            git push origin HEAD:release/eventboard-v2-pages
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hosted-v2-browser-evidence
          path: test-results
          retention-days: 30
