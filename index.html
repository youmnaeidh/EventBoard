<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="EventBoard يساعدك تكتشف فعاليات المدينة المنورة قبل ما يفوت وقتها." />
  <meta name="theme-color" content="#8f4fec" />
  <title>EventBoard | فعاليات المدينة المنورة</title>

  <link rel="icon" href="assets/branding/favicon.webp" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages.css" />
  <link rel="stylesheet" href="css/responsive.css" />
</head>
<body>
  <a class="skip-link" href="#app">تجاوز إلى المحتوى</a>

  <header class="site-header" id="siteHeader">
    <div class="container header-inner">
      <a class="brand" href="#home" aria-label="العودة إلى الصفحة الرئيسية">
        <img src="assets/branding/logo.webp" alt="شعار EventBoard" />
      </a>

      <button
        class="menu-button"
        id="menuButton"
        type="button"
        aria-label="فتح القائمة"
        aria-controls="mainNav"
        aria-expanded="false"
      >
        <span></span><span></span><span></span>
      </button>

      <nav class="main-nav" id="mainNav" aria-label="التنقل الرئيسي">
        <a href="#home" data-nav="home">الرئيسية</a>
        <a href="#events" data-nav="events">الفعاليات</a>
        <a href="#sell" data-nav="sell">بيع فعاليتك</a>
        <a href="#favorites" data-nav="favorites">
          المفضلة <span class="fav-count" id="favCount" aria-label="عدد الفعاليات المفضلة">0</span>
        </a>
      </nav>

    </div>
  </header>

  <main id="app" tabindex="-1"></main>

  <footer class="site-footer">
    <div class="footer-glow footer-glow-one"></div>
    <div class="footer-glow footer-glow-two"></div>

    <div class="container footer-grid">
      <div class="footer-brand">
        <img src="assets/branding/logo.webp" alt="EventBoard" />
        <p>دليلك لاكتشاف فعاليات المدينة المنورة واختيار التجربة الأقرب لاهتماماتك.</p>
      </div>

      <div>
        <h3>استكشف</h3>
        <a href="#events">جميع الفعاليات</a>
        <a href="#favorites">المفضلة</a>
        <a href="#sell">بيع فعاليتك</a>
      </div>

      <div>
        <h3>التصنيفات</h3>
        <a href="#events?category=ثقافة">ثقافة</a>
        <a href="#events?category=فن">فن</a>
        <a href="#events?category=عائلي">عائلي</a>
      </div>

      <div>
        <h3>تواصل</h3>
        <a href="https://www.linkedin.com/in/yomna-alhejaili-0b3991216" target="_blank" rel="noreferrer">LinkedIn</a>
        <a href="mailto:youmnaeidh@gmail.com">البريد الإلكتروني</a>
      </div>
    </div>

    <div class="container footer-bottom">
      <span>© EventBoard. جميع الحقوق محفوظة.</span>
    </div>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/data/events.js"></script>
  <script src="js/data/testimonials.js"></script>
  <script src="js/data/analytics.js"></script>
  <script src="js/core/storage.js"></script>
  <script src="js/core/recommendations.js"></script>
  <script src="js/core/analytics.js"></script>
  <script src="js/ui/components.js"></script>
  <script src="js/pages/home.js"></script>
  <script src="js/pages/events.js"></script>
  <script src="js/pages/details.js"></script>
  <script src="js/pages/sell.js"></script>
  <script src="js/pages/insights.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
